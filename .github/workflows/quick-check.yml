name: Quick Check

on:
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  quick-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            build_cmd: make
            test_cmd: env LD_LIBRARY_PATH=. ./example l example
          - os: macos-latest
            build_cmd: make
            test_cmd: env DYLD_LIBRARY_PATH=. ./example l example
          - os: windows-latest
            build_cmd: nmake -f makefile.vc
            test_cmd: outputs\release\example.exe l outputs\release\example.exe
    
    name: Quick (${{ matrix.os }})
    
    steps:
    - name: Checkout libsevenzip
      uses: actions/checkout@v4
      with:
        path: libsevenzip

    - name: Checkout 7-Zip (ip7z)
      uses: actions/checkout@v4
      with:
        repository: ip7z/7zip
        path: 7zip

    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Setup 7-Zip (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        find /usr/lib -name 7z.so -exec cp {} libsevenzip/ \; || true
        find /usr/lib64 -name 7z.so -exec cp {} libsevenzip/ \; || true

    - name: Setup 7-Zip (MacOS)
      if: runner.os == 'macOS'
      run: |
        brew install sevenzip
        find /opt/homebrew/Cellar/sevenzip -name 7z.so -exec cp {} libsevenzip/ \; || true
        find /usr/local/Cellar/sevenzip -name 7z.so -exec cp {} libsevenzip/ \; || true        

    - name: Setup 7-Zip (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        choco install 7zip -yes
        copy "C:\Program Files\7-Zip\7z.dll" libsevenzip\

    - name: Build (Unix)
      if: runner.os != 'Windows'
      working-directory: libsevenzip
      run: |
        ${{ matrix.build_cmd }} example

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      working-directory: libsevenzip
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86_amd64
        ${{ matrix.build_cmd }} example

    - name: Run tests
      working-directory: libsevenzip
      run: ${{ matrix.test_cmd }}
